<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cipher Duel — Word Guessing Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: #0a0f16;
    background-image: radial-gradient(circle at 20% 20%, #121b26 0%, #0a0f16 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  #cd-root {
    --ink: #0f1720;
    --panel: #161f2b;
    --panel-raised: #1c2733;
    --border: #263241;
    --text: #eef2f5;
    --text-muted: #7c8b9a;
    --gold: #e0a458;
    --gold-dim: #6b5636;
    --red: #c8635a;
    --red-dim: #5a2f2c;
    --green: #6fae7f;
    --green-dim: #294031;
    --font-display: 'JetBrains Mono', monospace;
    --font-body: 'Inter', -apple-system, sans-serif;

    position: relative;
    width: 100%;
    max-width: 560px;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    border-radius: 16px;
    min-height: 560px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  #cd-root.shake-lose { animation: cd-key-shake 0.55s ease; }

  .cd-confetti-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  .cd-confetti-piece { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; opacity: 0.95; animation-name: cd-confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards; }
  @keyframes cd-confetti-fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(460px) rotate(560deg); opacity: 0; } }

  .cd-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .cd-eyebrow {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .cd-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
  .cd-room-badge { font-family: var(--font-display); font-size: 12px; color: var(--text-muted); letter-spacing: 0.08em; }

  .cd-header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .cd-stat-badge { font-family: var(--font-display); font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .cd-stat-badge b { color: var(--gold); }
  .cd-icon-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-raised); color: var(--text-muted); font-size: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .cd-icon-btn:hover { border-color: var(--gold); color: var(--gold); }
  .cd-icon-btn.active { border-color: var(--green); color: var(--green); }

  .cd-body {
    flex: 1;
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .cd-lede { max-width: 420px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
  .cd-sub-lede { max-width: 420px; color: var(--text-muted); font-size: 12px; }

  .cd-cards { display: flex; gap: 16px; width: 100%; max-width: 520px; flex-wrap: wrap; justify-content: center; }
  .cd-card {
    flex: 1; min-width: 200px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 18px; cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
    text-align: left;
  }
  .cd-card:hover { border-color: var(--gold-dim); transform: translateY(-2px); }
  .cd-card-icon { font-family: var(--font-display); font-size: 22px; color: var(--gold); margin-bottom: 10px; }
  .cd-card-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .cd-card-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

  .cd-field { width: 100%; max-width: 320px; text-align: left; }
  .cd-field-label { font-family: var(--font-display); font-size: 10.5px; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 6px; display: block; }

  .cd-input {
    background: var(--panel-raised); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-display); font-size: 16px; letter-spacing: 0.04em;
    padding: 12px 14px; border-radius: 8px; width: 100%; outline: none;
  }
  .cd-input.cd-input-center { text-align: center; letter-spacing: 0.08em; text-transform: uppercase; }
  .cd-input:focus { border-color: var(--gold); }
  .cd-input::placeholder { color: var(--text-muted); text-transform: none; letter-spacing: normal; }

  .cd-btn {
    font-family: var(--font-body); font-weight: 600; font-size: 14px;
    padding: 11px 22px; border-radius: 8px; border: 1px solid var(--gold);
    background: var(--gold); color: #1a1206; cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .cd-btn:hover { opacity: 0.88; }
  .cd-btn:active { transform: scale(0.97); }
  .cd-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .cd-btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-weight: 500; }
  .cd-btn-ghost:hover { color: var(--text); border-color: var(--text-muted); opacity: 1; }
  .cd-btn-whatsapp { background: #25D366; border-color: #25D366; color: #06210f; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }

  .cd-share-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  .cd-link-row { display: flex; gap: 8px; width: 100%; max-width: 380px; align-items: center; }
  .cd-link-box {
    flex: 1; background: var(--panel-raised); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: var(--font-display); font-size: 11.5px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left;
  }

  .cd-error { color: var(--red); font-size: 13px; min-height: 16px; }
  .cd-copied { color: var(--green); font-size: 12px; min-height: 14px; }

  .cd-dial-wrap { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
  .cd-dial-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-display); }
  .cd-dial-num { font-size: 20px; font-weight: 700; }
  .cd-dial-sub { font-size: 9px; color: var(--text-muted); letter-spacing: 0.1em; }

  .cd-play-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .cd-players-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .cd-chip {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-family: var(--font-display); font-size: 11.5px; color: var(--text-muted);
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cd-chip.me { border-color: var(--gold-dim); color: var(--gold); }
  .cd-chip.live { border-color: var(--green); color: var(--green); }
  .cd-chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .cd-chip.me .cd-chip-dot { background: var(--gold); }
  .cd-chip.live .cd-chip-dot { background: var(--green); animation: cd-pulse 1.4s ease infinite; }
  @keyframes cd-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .cd-status-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .cd-status-text { text-align: left; }
  .cd-status-role { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; }
  .cd-status-msg { font-size: 13.5px; color: var(--text-muted); margin-top: 4px; max-width: 260px; }

  .cd-toast-slot { min-height: 20px; font-family: var(--font-display); font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em; }
  .cd-toast-slot.correct { color: var(--green); }
  .cd-toast-slot.wrong { color: var(--red); }
  .cd-toast-slot.pop { animation: cd-toast-pop 0.5s ease; }
  @keyframes cd-toast-pop { 0% { transform: translateY(-5px); opacity: 0; } 35% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; } }

  .cd-progress-track { width: 100%; max-width: 320px; height: 4px; background: var(--panel-raised); border-radius: 999px; overflow: hidden; }
  .cd-progress-fill { height: 100%; background: var(--green); border-radius: 999px; transition: width 0.4s ease; }

  .cd-word-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .cd-tile {
    width: 38px; height: 46px; border-bottom: 3px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 22px; font-weight: 700;
  }
  .cd-tile.shown { border-color: var(--green); color: var(--green); }
  .cd-tile.revealed { animation: cd-flip 0.45s ease, cd-tile-glow 0.9s ease; }
  .cd-tile.gap { border-bottom: none; width: 18px; }
  @keyframes cd-flip { 0% { transform: rotateX(90deg); opacity: 0; } 100% { transform: rotateX(0deg); opacity: 1; } }
  @keyframes cd-tile-glow { 0% { text-shadow: 0 0 0 transparent; } 35% { text-shadow: 0 0 16px var(--green); } 100% { text-shadow: 0 0 0 transparent; } }

  .cd-keyboard { display: flex; flex-direction: column; gap: 7px; align-items: center; }
  .cd-krow { display: flex; gap: 6px; }
  .cd-key {
    width: 32px; height: 38px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel-raised); color: var(--text);
    font-family: var(--font-display); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: transform 0.1s ease, opacity 0.25s ease;
  }
  .cd-key:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
  .cd-key:disabled { cursor: default; }
  .cd-key.correct { background: var(--green-dim); border-color: var(--green); color: var(--green); opacity: 1; }
  .cd-key.correct.just-correct { animation: cd-key-pop 0.4s ease; }
  .cd-key.wrong { background: var(--red-dim); border-color: var(--red); color: var(--red); opacity: 0.4; text-decoration: line-through; }
  .cd-key.wrong.just-wrong { opacity: 1; text-decoration: none; animation: cd-key-shake 0.4s ease; }
  @keyframes cd-key-pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes cd-key-shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

  .cd-banner { padding: 14px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  .cd-banner.win { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold); animation: cd-banner-pop 0.5s cubic-bezier(.34,1.56,.64,1); }
  .cd-banner.lose { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
  @keyframes cd-banner-pop { 0% { transform: scale(0.7); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }

  .cd-footer-note { font-size: 11px; color: var(--text-muted); max-width: 380px; line-height: 1.5; }

  .cd-loading { font-family: var(--font-display); font-size: 13px; color: var(--text-muted); }
  .cd-spin {
    width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--gold);
    border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 8px;
    animation: cd-spin 0.8s linear infinite;
  }
  @keyframes cd-spin { to { transform: rotate(360deg); } }

  .cd-history-list { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; text-align: left; }
  .cd-history-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .cd-history-word { font-family: var(--font-display); font-weight: 700; font-size: 13px; }
  .cd-history-meta { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
  .cd-history-result { font-family: var(--font-display); font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .cd-history-result.cracked { color: var(--green); }
  .cd-history-result.not-cracked { color: var(--red); }
  .cd-history-empty { color: var(--text-muted); font-size: 13px; max-width: 320px; }

  .cd-ad-slot { border-top: 1px solid var(--border); padding: 10px 20px 14px; text-align: center; }
  .cd-ad-label { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.14em; color: var(--text-muted); opacity: 0.55; margin-bottom: 6px; text-transform: uppercase; }
  .cd-ad-box { min-height: 46px; border: 1px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); padding: 6px 10px; }

  @media (max-width: 480px) {
    .cd-key { width: 27px; height: 34px; font-size: 11px; }
    .cd-tile { width: 30px; height: 40px; font-size: 18px; }
  }
</style>
</head>
<body>

<div id="cd-root">
  <div class="cd-confetti-layer" id="cd-confetti-layer"></div>
  <div class="cd-header">
    <div>
      <div class="cd-eyebrow">Two-Player Word Break</div>
      <div class="cd-title">CIPHER DUEL</div>
    </div>
    <div class="cd-header-actions">
      <div class="cd-stat-badge" id="cd-stat-badge"></div>
      <button class="cd-icon-btn" id="cd-sound-toggle" title="Toggle sound">🔊</button>
      <button class="cd-icon-btn" id="cd-history-toggle" title="Your rounds">☰</button>
      <div class="cd-room-badge" id="cd-room-badge"></div>
    </div>
  </div>
  <div class="cd-body" id="cd-body"><div class="cd-loading"><span class="cd-spin"></span>Connecting…</div></div>
  <div class="cd-ad-slot">
    <div class="cd-ad-label">Advertisement</div>
    <!-- Swap this box for your ad network's tag/snippet (e.g. AdSense unit) -->
    <div class="cd-ad-box" id="cd-ad-box">Ad space — 320×50</div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import {
  getFirestore, doc, setDoc, getDoc, onSnapshot
} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';

// =====================================================================
// 1) PASTE YOUR FIREBASE CONFIG HERE
//    Firebase console -> Project settings -> General -> "Your apps" -> Web app
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyDMn3w36WyNROI1YnjprMf9kiOt9dLYikk",
  authDomain: "cipher-duel-8e605.firebaseapp.com",
  projectId: "cipher-duel-8e605",
  storageBucket: "cipher-duel-8e605.firebasestorage.app",
  messagingSenderId: "678847899921",
  appId: "1:678847899921:web:fb1689b2d56ee416f604b0"
};
// =====================================================================

let firebaseReady = false;
let db = null;
try {
  const fbApp = initializeApp(firebaseConfig);
  db = getFirestore(fbApp);
  firebaseReady = firebaseConfig.apiKey !== "YOUR_API_KEY";
} catch (e) {
  firebaseReady = false;
}

const KEYROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
const MAX_WRONG = 8;
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const LS_PROFILE = 'cd_profile';
const LS_STATS = 'cd_stats';
const LS_HISTORY = 'cd_history';
const LS_SOUND = 'cd_sound';

const body = document.getElementById('cd-body');
const roomBadge = document.getElementById('cd-room-badge');

let inviteCode = '';
try {
  const hash = window.location.hash || '';
  const m = hash.match(/room=([A-Z0-9]{4})/i);
  if (m) inviteCode = m[1].toUpperCase();
} catch (e) {}

let phase = inviteCode ? 'guestJoinFromLink' : 'lobby';
let previousPhase = 'lobby';
let role = null;
let roomCode = '';
let myName = '';
let room = null;
let errorMsg = '';
let copiedMsg = '';
let unsubscribe = null;
let busy = false;

let previousGuessedLetters = [];
let lastCelebratedStatus = null;
let resultRecorded = false;

const profile = loadProfile();
myName = profile.name || '';
const stats = loadStats();
const history = loadHistory();
let soundOn = true;
try { const v = localStorage.getItem(LS_SOUND); if (v !== null) soundOn = v === '1'; } catch (e) {}

// ---------- local persistence ----------
function loadProfile() {
  try {
    const raw = localStorage.getItem(LS_PROFILE);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'p-' + Math.random().toString(36).slice(2);
  const p = { id, name: '' };
  try { localStorage.setItem(LS_PROFILE, JSON.stringify(p)); } catch (e) {}
  return p;
}
function saveProfileName(name) {
  profile.name = name;
  try { localStorage.setItem(LS_PROFILE, JSON.stringify(profile)); } catch (e) {}
}
function loadStats() {
  try {
    const raw = localStorage.getItem(LS_STATS);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { played: 0, cracked: 0, notCracked: 0, streak: 0, bestStreak: 0 };
}
function saveStats() { try { localStorage.setItem(LS_STATS, JSON.stringify(stats)); } catch (e) {} }
function loadHistory() {
  try {
    const raw = localStorage.getItem(LS_HISTORY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}
function pushHistory(entry) {
  history.unshift(entry);
  if (history.length > 30) history.length = 30;
  try { localStorage.setItem(LS_HISTORY, JSON.stringify(history)); } catch (e) {}
}
function recordResult(result) {
  stats.played++;
  if (result === 'cracked') {
    stats.cracked++; stats.streak++; stats.bestStreak = Math.max(stats.bestStreak, stats.streak);
  } else {
    stats.notCracked++; stats.streak = 0;
  }
  saveStats();
  pushHistory({
    code: roomCode,
    word: room.word,
    role,
    result,
    wrong: room.wrongGuesses.length,
    ts: Date.now(),
    opponent: role === 'host' ? (room.guestName || 'your opponent') : (room.hostName || 'your opponent')
  });
  updateHeaderChrome();
}

// ---------- sound ----------
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, dur, type, delay, gain) {
  try {
    const ctx = getCtx();
    const t0 = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain || 0.15, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function playSound(kind) {
  if (!soundOn) return;
  if (kind === 'correct') { beep(660, 0.12, 'sine'); beep(880, 0.14, 'sine', 0.08); }
  else if (kind === 'wrong') { beep(160, 0.22, 'sawtooth'); }
  else if (kind === 'win') { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.16, 'triangle', i * 0.11)); }
  else if (kind === 'lose') { [392, 330, 262].forEach((f, i) => beep(f, 0.22, 'sawtooth', i * 0.15)); }
}
function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem(LS_SOUND, soundOn ? '1' : '0'); } catch (e) {}
  updateHeaderChrome();
  if (soundOn) playSound('correct');
}

// ---------- confetti / shake ----------
function spawnConfetti() {
  const layer = document.getElementById('cd-confetti-layer');
  if (!layer) return;
  const colors = ['#e0a458', '#6fae7f', '#c8635a', '#eef2f5', '#9ecbe0'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 48; i++) {
    const el = document.createElement('div');
    el.className = 'cd-confetti-piece';
    el.style.left = (Math.random() * 100) + '%';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (0.9 + Math.random() * 0.9) + 's';
    el.style.animationDelay = (Math.random() * 0.35) + 's';
    frag.appendChild(el);
  }
  layer.innerHTML = '';
  layer.appendChild(frag);
  setTimeout(() => { if (layer) layer.innerHTML = ''; }, 2200);
}
function shakeRoot() {
  const rootEl = document.getElementById('cd-root');
  if (!rootEl) return;
  rootEl.classList.remove('shake-lose');
  void rootEl.offsetWidth;
  rootEl.classList.add('shake-lose');
  setTimeout(() => rootEl.classList.remove('shake-lose'), 600);
}

// ---------- firestore helpers ----------
function genCode() {
  let c = '';
  for (let i = 0; i < 4; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return c;
}
function roomRef(code) { return doc(db, 'rooms', code); }
async function saveRoom(code, data) { await setDoc(roomRef(code), data); }
async function loadRoomOnce(code) {
  try {
    const snap = await getDoc(roomRef(code));
    return snap.exists() ? snap.data() : null;
  } catch (e) { return null; }
}
function stopListening() { if (unsubscribe) { unsubscribe(); unsubscribe = null; } }
function startListening(code) {
  stopListening();
  unsubscribe = onSnapshot(roomRef(code), (snap) => {
    if (snap.exists()) { room = snap.data(); render(); }
  });
}

function revealedWord(word, guessed) {
  return word.split('').map(ch => {
    if (ch === ' ') return { ch: ' ', gap: true };
    return { ch: guessed.includes(ch) ? ch : '', gap: false };
  });
}
function isWon(word, guessed) {
  return word.split('').every(ch => ch === ' ' || guessed.includes(ch));
}
function inviteLink(code) {
  const base = window.location.href.split('#')[0];
  return base + '#room=' + code;
}
function validName(v) { return /^.{2,24}$/.test((v || '').trim()); }

async function submitGuess(letter) {
  if (!room || busy) return;
  if (room.guessedLetters.includes(letter)) return;
  if (room.status !== 'playing') return;
  busy = true;
  const guessedLetters = [...room.guessedLetters, letter];
  const correct = room.word.includes(letter);
  const wrongGuesses = correct ? room.wrongGuesses : [...room.wrongGuesses, letter];
  let status = 'playing';
  if (isWon(room.word, guessedLetters)) status = 'won';
  else if (wrongGuesses.length >= MAX_WRONG) status = 'lost';
  room = { ...room, guessedLetters, wrongGuesses, status };
  render();
  await saveRoom(roomCode, room);
  busy = false;
}

async function createRoom(name, word) {
  const code = genCode();
  const data = {
    word: word.trim().toUpperCase(),
    hostName: name.trim(),
    hostId: profile.id,
    guestName: '',
    guestId: '',
    guessedLetters: [],
    wrongGuesses: [],
    status: 'waiting',
    guestJoined: false,
    createdAt: Date.now()
  };
  await saveRoom(code, data);
  roomCode = code;
  role = 'host';
  myName = name.trim();
  room = data;
  previousGuessedLetters = [];
  lastCelebratedStatus = null;
  resultRecorded = false;
  phase = 'hostPlay';
  startListening(code);
  render();
}

async function joinRoom(code, name) {
  errorMsg = '';
  render();
  const data = await loadRoomOnce(code);
  if (!data) {
    errorMsg = 'No round found with that code. Double check it with your opponent.';
    render();
    return;
  }
  data.guestJoined = true;
  data.guestName = name.trim();
  data.guestId = profile.id;
  if (data.status === 'waiting') data.status = 'playing';
  roomCode = code;
  role = 'guest';
  myName = name.trim();
  room = data;
  previousGuessedLetters = [];
  lastCelebratedStatus = null;
  resultRecorded = false;
  phase = 'guestPlay';
  await saveRoom(code, data);
  startListening(code);
  render();
}

async function newRound() {
  phase = 'hostSetup';
  stopListening();
  render();
}

function leave() {
  stopListening();
  phase = 'lobby';
  role = null;
  roomCode = '';
  room = null;
  errorMsg = '';
  try { window.location.hash = ''; } catch (e) {}
  render();
}

function openHistory() { previousPhase = phase; phase = 'history'; render(); }
function closeHistory() { phase = previousPhase || 'lobby'; render(); }

// ---------- invite: share sheet + optional contact picker ----------
async function shareInvite() {
  const link = inviteLink(roomCode);
  const text = (myName || 'A friend') + ' locked in a word for Cipher Duel — crack it if you can. Join room ' + roomCode + ':';
  if (navigator.share) {
    try { await navigator.share({ title: 'Cipher Duel', text, url: link }); } catch (e) { /* cancelled */ }
  } else {
    copyToClipboard(link);
  }
}
async function pickContact() {
  if (!(navigator.contacts && navigator.contacts.select)) return;
  try {
    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
    if (!contacts || !contacts.length) return;
    const c = contacts[0];
    const tel = (c.tel && c.tel[0]) ? c.tel[0].replace(/\s+/g, '') : '';
    const contactName = (c.name && c.name[0]) ? c.name[0] : 'your opponent';
    const link = inviteLink(roomCode);
    const text = (myName || 'A friend') + ' challenged you to crack a secret word on Cipher Duel. Join room ' + roomCode + ': ' + link;
    if (tel) {
      window.location.href = 'sms:' + tel + '?body=' + encodeURIComponent(text);
    } else {
      copyToClipboard(link);
      copiedMsg = 'Copied — send it to ' + contactName + ' yourself.';
      render();
    }
  } catch (e) { /* cancelled */ }
}

function dialSVG(wrongCount) {
  const pct = Math.min(wrongCount / MAX_WRONG, 1);
  const r = 42, c = 2 * Math.PI * r;
  const offset = c * (1 - pct);
  let stroke = '#6fae7f';
  if (pct >= 0.75) stroke = '#c8635a';
  else if (pct >= 0.4) stroke = '#e0a458';
  return `
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="#263241" stroke-width="8"/>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="${stroke}"
        stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 50 50)" style="transition: stroke-dashoffset 0.4s ease, stroke 0.4s ease;"/>
    </svg>`;
}

function copyToClipboard(text) {
  try {
    navigator.clipboard.writeText(text).then(() => {
      copiedMsg = 'Link copied!';
      render();
      setTimeout(() => { copiedMsg = ''; render(); }, 1800);
    }).catch(fallbackCopy);
  } catch (e) {
    fallbackCopy();
  }
  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); copiedMsg = 'Link copied!'; } catch (e2) { copiedMsg = 'Copy failed — select and copy manually.'; }
    document.body.removeChild(ta);
    render();
    setTimeout(() => { copiedMsg = ''; render(); }, 1800);
  }
}

    } else {
      badge.innerHTML = '';
    }
  }
  const soundBtn = document.getElementById('cd-sound-toggle');
  if (soundBtn) {
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.classList.toggle('active', soundOn);
  }
}

function renderHostSetup() {
  roomBadge.textContent = '';
  body.innerHTML = `
    <div class="cd-eyebrow" style="opacity:0.7">STEP 1 &middot; LOCK IN YOUR WORD</div>
    <div class="cd-lede">Enter your name, then pick a word or short phrase. Your opponent won't see the word &mdash; only its length and blanks.</div>
    <div class="cd-field">
      <span class="cd-field-label">YOUR NAME</span>
      <input class="cd-input" id="cd-name-input" placeholder="e.g. Vernon" maxlength="24" autocomplete="name" />
    </div>
    <div class="cd-field">
      <span class="cd-field-label">SECRET WORD OR PHRASE</span>
      <input class="cd-input" id="cd-word-input" placeholder="e.g. RECONCILIATION" maxlength="24" autocomplete="off" />
    </div>
    <div class="cd-error" id="cd-error">${errorMsg}</div>
    <div style="display:flex; gap:10px;">
      <button class="cd-btn" id="cd-lock-btn">Lock word &amp; get invite link</button>
      <button class="cd-btn cd-btn-ghost" id="cd-back-btn">Back</button>
    </div>
  `;
  const nameInput = body.querySelector('#cd-name-input');
  const wordInput = body.querySelector('#cd-word-input');
  nameInput.value = myName;
  (myName ? wordInput : nameInput).focus();
  wordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') lock(); });
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') wordInput.focus(); });
  body.querySelector('#cd-lock-btn').onclick = lock;
  body.querySelector('#cd-back-btn').onclick = leave;

  function lock() {
    const name = nameInput.value.trim();
    const val = wordInput.value.trim();
    if (!validName(name)) {
      errorMsg = 'Enter your name (2-24 characters).';
      render();
      return;
    }
    if (!/^[A-Za-z ]{2,24}$/.test(val)) {
      errorMsg = 'Use letters only for the word (2-24 characters, spaces allowed for phrases).';
      render();
      return;
    }
    errorMsg = '';
    saveProfileName(name);
    createRoom(name, val);
  }
}

    <div class="cd-eyebrow" style="opacity:0.7">STEP 1 &middot; ENTER THE CODE</div>
    <div class="cd-lede">Ask your opponent for their 4-character room code, or open the invite link they sent you.</div>
    <div class="cd-field">
      <span class="cd-field-label">YOUR NAME</span>
      <input class="cd-input" id="cd-name-input" placeholder="e.g. Vernon" maxlength="24" autocomplete="name" />
    </div>

      <span class="cd-field-label">ROOM CODE</span>
      <input class="cd-input cd-input-center" id="cd-code-input" placeholder="CODE" maxlength="4" autocomplete="off" />
    </div>

      <button class="cd-btn" id="cd-join-btn">Join round</button>
      <button class="cd-btn cd-btn-ghost" id="cd-back-btn">Back</button>

  codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.toUpperCase(); });
  codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });

function renderHistory() {
  const rows = history.length ? history.map(h => {
    const label = h.role === 'host'
      ? (h.result === 'cracked' ? `${h.opponent} cracked it` : `${h.opponent} couldn't crack it`)
      : (h.result === 'cracked' ? 'You cracked it' : "You didn't crack it");
    const date = new Date(h.ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return `
      <div class="cd-history-row">
        <div>
          <div class="cd-history-word">${h.word}</div>
          <div class="cd-history-meta">${label} &middot; ${date}</div>
        </div>
        <div class="cd-history-result ${h.result}">${h.result === 'cracked' ? '&#10003; CRACKED' : '&#10005; MISSED'}</div>
      </div>`;
  }).join('') : `<div class="cd-history-empty">No rounds played yet. Every round you finish shows up here, win or lose.</div>`;

  body.innerHTML = `
    <div class="cd-eyebrow" style="opacity:0.7">YOUR ROUNDS</div>
    <div class="cd-history-list">${rows}</div>
    <button class="cd-btn cd-btn-ghost" id="cd-history-back">Back</button>
  `;
  body.querySelector('#cd-history-back').onclick = closeHistory;
}

function renderPlay() {
  roomBadge.textContent = 'ROOM ' + roomCode;
  const wrongCount = room.wrongGuesses.length;
  const tiles = revealedWord(room.word, room.guessedLetters);
  const won = room.status === 'won';
  const lost = room.status === 'lost';
  const waiting = room.status === 'waiting';

  const newLetters = room.guessedLetters.filter(l => !previousGuessedLetters.includes(l));
  const justLetter = newLetters.length === 1 ? newLetters[0] : null;
  const justCorrect = justLetter ? room.word.includes(justLetter) : null;

  if (justLetter) {
    playSound(justCorrect ? 'correct' : 'wrong');
  }

  const tileHtml = tiles.map(t => {
    if (t.gap) return `<div class="cd-tile gap"></div>`;
    if (!t.ch) return `<div class="cd-tile"></div>`;
    const isFresh = justCorrect && t.ch === justLetter;
    return `<div class="cd-tile shown ${isFresh ? 'revealed' : ''}">${t.ch}</div>`;
  }).join('');

  const totalLetters = new Set(room.word.replace(/ /g, '').split('')).size;
  const foundLetters = new Set(room.guessedLetters.filter(l => room.word.includes(l))).size;
  const progressPct = totalLetters ? Math.round((foundLetters / totalLetters) * 100) : 0;

  const keyboardHtml = KEYROWS.map(row => `
    <div class="cd-krow">
      ${row.split('').map(letter => {
        const guessed = room.guessedLetters.includes(letter);
        const wrong = guessed && !room.word.includes(letter);
        const correct = guessed && room.word.includes(letter);
        const justCls = letter === justLetter ? (justCorrect ? 'just-correct' : 'just-wrong') : '';
        const cls = wrong ? 'wrong' : correct ? 'correct' : '';
        const disabled = (role !== 'guest') || guessed || room.status !== 'playing';
        return `<button class="cd-key ${cls} ${justCls}" data-letter="${letter}" ${disabled ? 'disabled' : ''}>${letter}</button>`;
      }).join('')}
    </div>
  `).join('');

  let banner = '';
  if (won) banner = `<div class="cd-banner win">&#10003; Word cracked: ${room.word}</div>`;
  else if (lost) banner = `<div class="cd-banner lose">&#10005; Out of guesses. The word was ${room.word}</div>`;

  const roleLabel = role === 'host' ? 'YOU SET THE WORD' : 'YOU ARE GUESSING';
  let statusMsg = '';
  if (role === 'host' && waiting) statusMsg = 'Share your invite below \u2014 the board updates the instant your opponent joins.';
  else if (role === 'host') statusMsg = 'Watching live \u2014 every guess is checked against your word automatically.';
  else if (role === 'guest') statusMsg = 'Pick a letter. You will know instantly whether it is in the word.';

  const link = inviteLink(roomCode);
  const waText = encodeURIComponent(`${myName || 'Someone'} locked in a word for Cipher Duel \u2014 crack it if you can. Join room ${roomCode}: ${link}`);
  const canShare = typeof navigator !== 'undefined' && !!navigator.share;
  const canPickContact = typeof navigator !== 'undefined' && !!(navigator.contacts && navigator.contacts.select);
  const inviteBlock = (role === 'host' && waiting) ? `
    <div class="cd-field" style="max-width:380px;">
      <span class="cd-field-label">INVITE LINK &middot; ROOM ${roomCode}</span>
      <div class="cd-link-row">
        <div class="cd-link-box">${link}</div>
        <button class="cd-btn cd-btn-ghost" id="cd-copy-btn" style="padding:10px 14px;">Copy</button>
      </div>
      <div class="cd-copied">${copiedMsg}</div>
    </div>
    <div class="cd-share-row">
      ${canShare ? `<button class="cd-btn" id="cd-share-btn">Share invite</button>` : ''}
      <a href="https://wa.me/?text=${waText}" target="_blank" rel="noopener" class="cd-btn cd-btn-whatsapp" id="cd-wa-btn">WhatsApp</a>
      ${canPickContact ? `<button class="cd-btn cd-btn-ghost" id="cd-contact-btn">Pick a contact</button>` : ''}
    </div>
    <div class="cd-sub-lede">"Share invite" opens your device's own share sheet, so you can pick anyone from Messages, WhatsApp, Mail or your contacts directly \u2014 no typing a number.</div>
  ` : '';

  const playersRow = `
    <div class="cd-players-row">
      <div class="cd-chip ${role === 'host' ? 'me' : ''} live"><span class="cd-chip-dot"></span>${room.hostName || 'Host'}</div>
      <div class="cd-chip ${role === 'guest' ? 'me' : ''} ${room.guestJoined ? 'live' : ''}"><span class="cd-chip-dot"></span>${room.guestJoined ? (room.guestName || 'Guest') : 'Waiting\u2026'}</div>
    </div>
  `;

  body.innerHTML = `
    <div class="cd-play-wrap">
      ${playersRow}

      ${inviteBlock}

      ${!waiting ? `
      <div class="cd-status-row">
        <div class="cd-dial-wrap">
          ${dialSVG(wrongCount)}
          <div class="cd-dial-label">
            <div class="cd-dial-num">${wrongCount}/${MAX_WRONG}</div>
            <div class="cd-dial-sub">WRONG</div>
          </div>
        </div>
        <div class="cd-status-text">
          <div class="cd-status-role">${roleLabel}</div>
          <div class="cd-status-msg">${statusMsg}</div>
        </div>
      </div>

      <div class="cd-toast-slot ${justLetter ? (justCorrect ? 'correct pop' : 'wrong pop') : ''}">${justLetter ? (justCorrect ? `&#10003; "${justLetter}" is in the word!` : `&#10005; "${justLetter}" isn't in the word`) : ''}</div>

      ${banner}

      <div class="cd-word-row">${tileHtml}</div>

      ${!won && !lost ? `<div class="cd-progress-track"><div class="cd-progress-fill" style="width:${progressPct}%;"></div></div>` : ''}

      ${role === 'guest' && !won && !lost ? `<div class="cd-keyboard">${keyboardHtml}</div>` : ''}
      ` : ''}

      <div style="display:flex; gap:10px;">
        ${role === 'host' && (won || lost) ? `<button class="cd-btn" id="cd-newround-btn">Set a new word</button>` : ''}
        <button class="cd-btn cd-btn-ghost" id="cd-leave-btn">Back to lobby</button>
      </div>

      <div class="cd-footer-note">Names are self-entered, not verified \u2014 they're just here to tell the two of you apart. Game state syncs live via Firestore, on any device, anywhere.</div>
    </div>
  `;

  if (role === 'guest') {
    body.querySelectorAll('.cd-key').forEach(btn => {
      btn.onclick = () => submitGuess(btn.dataset.letter);
    });
  }
  const copyBtn = body.querySelector('#cd-copy-btn');
  if (copyBtn) copyBtn.onclick = () => copyToClipboard(link);
  const shareBtn = body.querySelector('#cd-share-btn');
  if (shareBtn) shareBtn.onclick = shareInvite;
  const contactBtn = body.querySelector('#cd-contact-btn');
  if (contactBtn) contactBtn.onclick = pickContact;
  const newRoundBtn = body.querySelector('#cd-newround-btn');
  if (newRoundBtn) newRoundBtn.onclick = newRound;
  body.querySelector('#cd-leave-btn').onclick = leave;

  previousGuessedLetters = [...room.guessedLetters];

  if (won && lastCelebratedStatus !== 'won') {
    lastCelebratedStatus = 'won';
    playSound('win');
    spawnConfetti();
    if (!resultRecorded) { recordResult('cracked'); resultRecorded = true; }
  } else if (lost && lastCelebratedStatus !== 'lost') {
    lastCelebratedStatus = 'lost';
    playSound('lose');
    shakeRoot();
    if (!resultRecorded) { recordResult('not-cracked'); resultRecorded = true; }
  }
}

function render() {
  updateHeaderChrome();
  if (!firebaseReady) { renderSetupNeeded(); return; }
  if (phase === 'lobby') renderLobby();
  else if (phase === 'hostSetup') renderHostSetup();
  else if (phase === 'guestJoin') renderGuestJoin();
  else if (phase === 'guestJoinFromLink') renderGuestJoinFromLink();
  else if (phase === 'hostPlay' || phase === 'guestPlay') renderPlay();
  else if (phase === 'history') renderHistory();
}

document.getElementById('cd-sound-toggle').onclick = toggleSound;
document.getElementById('cd-history-toggle').onclick = openHistory;

render();
</script>
